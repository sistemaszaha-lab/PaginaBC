<section
  class="cuenta-column card border-0 shadow-sm flex-shrink-0"
  data-cuenta-column="1"
  data-estado="{{ columna.estado }}"
  data-total="{{ columna.count }}"
  data-loaded="{{ columna.loaded }}"
>
  <header class="cuenta-column__header">
    <div class="d-flex align-items-start justify-content-between gap-3">
      <h3 class="cuenta-column__title mb-0">{{ columna.titulo }}</h3>
      <span class="cuenta-column__count" data-cuenta-column-count="1">{{ columna.count }}</span>
    </div>
  </header>

  {% if es_primera_columna %}
  <div class="cuenta-column__actions px-3 pt-3">
    <button
      type="button"
      class="btn btn-sm cuenta-column__add-btn"
      data-cuenta-inline-open="1"
      data-estado="{{ columna.estado }}"
      data-estado-label="{{ columna.titulo }}"
    >
      + Nueva cuenta
    </button>
  </div>
  {% endif %}

  <div class="cuenta-column__body columna-drop d-flex flex-column gap-3" data-estado="{{ columna.estado }}">
    {% for cuenta in columna.items %}
      {% include "cuenta_gastos/_card.html" with cuenta=cuenta estados_ui=estados_ui only %}
    {% empty %}
      <div class="cuenta-column__empty">Sin registros.</div>
    {% endfor %}
  </div>

  <div class="px-3 pb-3" data-cuenta-load-controls="1">
    <button
      type="button"
      class="btn btn-sm btn-outline-secondary w-100"
      data-cuenta-load-more="1"
      data-load-url="{{ columna.load_url }}"
      {% if not columna.has_more %}hidden{% endif %}
    >
      Cargar más ({{ columna.remaining }} restantes)
    </button>
    <div
      class="small text-muted text-center mt-2"
      data-cuenta-load-indicator="1"
      role="status"
      hidden
    >
      Cargando tarjetas...
    </div>
    <div
      class="small text-danger text-center mt-2"
      data-cuenta-load-error="1"
      role="alert"
      hidden
    ></div>
  </div>
</section>
