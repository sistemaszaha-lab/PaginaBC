<div
  class="cuenta-inline-value"
  data-date-value="{% if cuenta.fecha_vencimiento %}{{ cuenta.fecha_vencimiento|date:'Y-m-d' }}{% endif %}"
  >
  <span class="cuenta-chip cuenta-chip--due">
    {% if cuenta.fecha_vencimiento %}
      Vence {{ cuenta.fecha_vencimiento|date:"d/m/Y" }}
    {% else %}
      Sin fecha
    {% endif %}
  </span>
</div>
