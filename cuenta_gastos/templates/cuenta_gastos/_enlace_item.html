<div class="cuenta-section-item">
  <div class="min-w-0">
    <div class="fw-semibold">{{ enlace.titulo }}</div>
    <a href="{{ enlace.url }}" target="_blank" rel="noopener" class="text-decoration-none text-break">{{ enlace.url }}</a>
  </div>
  <form
    method="post"
    action="{% url 'cuenta_gastos:eliminar_enlace' cuenta.id %}"
    data-cuenta-enlace-delete="1"
    data-cuenta-id="{{ cuenta.id }}"
    class="d-inline"
  >
    {% csrf_token %}
    <input type="hidden" name="layout" value="{{ layout|default:'modal' }}">
    <input type="hidden" name="enlace_id" value="{{ enlace.id }}">
    <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
  </form>
</div>
