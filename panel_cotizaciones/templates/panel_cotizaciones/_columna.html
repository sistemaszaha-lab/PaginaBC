<div class="col-12 col-lg-4">
  <section
    class="panel-cotizacion-column card h-100 border-0 shadow-sm"
    data-panel-cotizacion-column="1"
    data-estado="{{ columna.estado }}"
    data-total="{{ columna.count }}"
    data-loaded="{{ columna.loaded }}">
    <div class="card-header panel-cotizacion-column__header">
      <div>
        <p class="panel-cotizacion-column__eyebrow mb-1">Etapa</p>
        <h2 class="panel-cotizacion-column__title mb-0">{{ columna.estado_texto }}</h2>
      </div>
      <span class="badge panel-cotizacion-column__count" data-panel-cotizacion-column-count="1">{{ columna.count }}</span>
    </div>

    <div class="panel-cotizacion-column__actions px-3 pt-3">
      <button
        type="button"
        class="btn btn-sm panel-cotizacion-column__add-btn"
        data-panel-cotizacion-inline-open="1"
        data-estado="{{ columna.estado }}"
        data-estado-label="{{ columna.estado_texto }}">
        + Nueva cotizacion
      </button>
    </div>

    <div class="card-body panel-cotizaciones-col panel-cotizacion-column__body" data-estado="{{ columna.estado }}">
      {% for c in columna.items %}
        {% include "panel_cotizaciones/_tarjeta.html" with c=c only %}
      {% empty %}
        <div class="panel-cotizacion-empty">Sin cotizaciones.</div>
      {% endfor %}
    </div>

    <div class="px-3 pb-3" data-panel-cotizacion-load-controls="1">
      <button
        type="button"
        class="btn btn-sm btn-outline-secondary w-100"
        data-panel-cotizacion-load-more="1"
        data-load-url="{{ columna.load_url }}"
        {% if not columna.has_more %}hidden{% endif %}>
        Cargar más ({{ columna.remaining }} restantes)
      </button>
      <div
        class="small text-muted text-center mt-2"
        data-panel-cotizacion-load-indicator="1"
        role="status"
        hidden>
        Cargando tarjetas...
      </div>
      <div
        class="small text-danger text-center mt-2"
        data-panel-cotizacion-load-error="1"
        role="alert"
        hidden></div>
    </div>
  </section>
</div>
