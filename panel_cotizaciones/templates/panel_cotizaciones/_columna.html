<div class="panel-cotizaciones-column-item" data-panel-cotizacion-column-item="1">
  <section
    class="panel-cotizacion-column card h-100 border-0 shadow-sm"
    data-panel-cotizacion-column="1"
    data-columna-id="{{ columna.id }}"
    data-columna-codigo="{{ columna.codigo }}"
    data-columna-nombre="{{ columna.nombre }}"
    data-edit-url="{% url 'panel_cotizaciones:columna_editar' columna.id %}"
    data-delete-url="{% url 'panel_cotizaciones:columna_eliminar' columna.id %}"
    data-paste-url="{{ columna.paste_url }}"
    data-estado="{{ columna.estado }}"
    data-total="{{ columna.count }}"
    data-loaded="{{ columna.loaded }}">
    <div class="card-header panel-cotizacion-column__header">
      <div class="min-w-0 flex-grow-1">
        <h2 class="panel-cotizacion-column__title mb-0" data-panel-cotizacion-column-title="1">{{ columna.estado_texto }}</h2>
      </div>
      <div class="d-flex align-items-start gap-2">
        <span class="badge panel-cotizacion-column__count" data-panel-cotizacion-column-count="1">{{ columna.count }}</span>
        <div class="dropdown">
          <button
            class="btn btn-sm btn-light panel-cotizacion-column__menu-btn"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false">
            Opciones
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <button
                type="button"
                class="dropdown-item"
                data-panel-cotizacion-column-paste="1"
                disabled>
                Pegar tarjeta
              </button>
            </li>
            <li>
              <button
                type="button"
                class="dropdown-item"
                data-panel-cotizacion-copy-clear="1"
                disabled>
                Cancelar copia
              </button>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <button
                type="button"
                class="dropdown-item"
                data-panel-cotizacion-column-edit-open="1">
                Editar columna
              </button>
            </li>
            <li>
              <button
                type="button"
                class="dropdown-item text-danger"
                data-panel-cotizacion-column-delete-open="1">
                Eliminar columna
              </button>
            </li>
          </ul>
        </div>
      </div>
    </div>

    {% if es_primera_columna %}
    <div class="panel-cotizacion-column__actions px-3 pt-3">
      <button
        type="button"
        class="btn btn-sm panel-cotizacion-column__add-btn"
        data-panel-cotizacion-inline-open="1"
        data-columna-id="{{ columna.id }}"
        data-estado="{{ columna.estado }}"
        data-estado-label="{{ columna.estado_texto }}">
        + Nueva cotización
      </button>
    </div>
    {% endif %}

    <div
      class="card-body panel-cotizaciones-col panel-cotizacion-column__body"
      data-columna-id="{{ columna.id }}"
      data-columna-codigo="{{ columna.codigo }}"
      data-columna-nombre="{{ columna.nombre }}"
      data-estado="{{ columna.estado }}">
      {% for c in columna.items %}
        {% include "panel_cotizaciones/_tarjeta.html" with c=c columnas_estado=columnas_estado only %}
      {% empty %}
        <div class="panel-cotizacion-empty">Sin cotizaciones.</div>
      {% endfor %}
    </div>

    <div class="px-3 pb-3" data-panel-cotizacion-load-controls="1">
      <button
        type="button"
        class="btn btn-sm btn-outline-secondary w-100"
        data-panel-cotizacion-load-more="1"
        data-load-url="{{ columna.load_url }}"
        {% if not columna.has_more %}hidden{% endif %}>
        Cargar más ({{ columna.remaining }} restantes)
      </button>
      <div
        class="small text-muted text-center mt-2"
        data-panel-cotizacion-load-indicator="1"
        role="status"
        hidden>
        Cargando tarjetas...
      </div>
      <div
        class="small text-danger text-center mt-2"
        data-panel-cotizacion-load-error="1"
        role="alert"
        hidden></div>
    </div>
  </section>
</div>
