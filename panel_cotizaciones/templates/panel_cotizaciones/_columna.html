<div class="col-12 col-lg-4">
  <section class="panel-cotizacion-column card h-100 border-0 shadow-sm">
    <div class="card-header panel-cotizacion-column__header">
      <div>
        <p class="panel-cotizacion-column__eyebrow mb-1">Etapa</p>
        <h2 class="panel-cotizacion-column__title mb-0">{{ estado_texto }}</h2>
      </div>
      <span class="badge panel-cotizacion-column__count" data-panel-cotizacion-column-count="1">{{ items|length }}</span>
    </div>

    <div class="panel-cotizacion-column__actions px-3 pt-3">
      <button
        type="button"
        class="btn btn-sm panel-cotizacion-column__add-btn"
        data-panel-cotizacion-inline-open="1"
        data-estado="{{ estado }}">
        + Nueva cotizacion
      </button>
    </div>

    <div class="px-3 pt-3 d-none" data-panel-cotizacion-inline-container="1" data-estado="{{ estado }}">
      {% include "panel_cotizaciones/_inline_create_form.html" with form=inline_form estado=estado only %}
    </div>

    <div class="card-body panel-cotizaciones-col panel-cotizacion-column__body" data-estado="{{ estado }}">
      {% for c in items %}
        {% include "panel_cotizaciones/_tarjeta.html" with c=c only %}
      {% empty %}
        <div class="panel-cotizacion-empty">Sin cotizaciones.</div>
      {% endfor %}
    </div>
  </section>
</div>
