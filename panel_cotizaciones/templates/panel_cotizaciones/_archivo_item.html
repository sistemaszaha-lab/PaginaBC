<div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center gap-3" data-panel-cotizacion-archivo-item="1">
  <div class="min-w-0">
    <div class="fw-semibold text-break">{{ archivo.nombre_archivo }}</div>
    <div class="small text-muted">{{ archivo.fecha|date:"d M Y H:i" }}</div>
  </div>
  <div class="d-flex align-items-center gap-2">
    <a href="{{ archivo.archivo.url }}" class="btn btn-sm btn-outline-secondary" target="_blank" rel="noopener noreferrer">Abrir</a>
    <button
      type="button"
      class="btn btn-sm btn-outline-danger"
      data-panel-cotizacion-archivo-delete="1"
      data-delete-url="{% url 'panel_cotizaciones:archivo_eliminar' archivo.cotizacion_id archivo.id %}">
      Eliminar
    </button>
  </div>
</div>
