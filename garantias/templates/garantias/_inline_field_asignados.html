{% load garantias_extras %}
<div
  class="garantia-inline-value"
  data-garantia-quick-edit-open="1"
  data-selected-ids="{% for u in g.asignados.all %}{{ u.id }}{% if not forloop.last %},{% endif %}{% endfor %}"
  data-garantia-quick-edit-url="{% url 'garantias:actualizar_garantia_inline' g.id %}">
  <div class="garantia-card__assignees">
    {% for u in g.asignados.all %}
      {% if u.first_name %}
        <span class="garantia-card__assignee" title="{{ u.first_name|default:u.username }}">
          {{ u.first_name|iniciales_nombre }}
        </span>
      {% endif %}
    {% empty %}
      <span class="garantia-card__placeholder">Sin asignados</span>
    {% endfor %}
  </div>
</div>
