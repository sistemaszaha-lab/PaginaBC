{% load kanban_tags %}
<section data-garantia-tags-section="1" data-garantia-id="{{ garantia.id }}" class="garantia-tags-section" aria-busy="false">
  <div class="d-flex align-items-center justify-content-between gap-2 mb-3">
    <h6 class="mb-0">Etiquetas</h6>
    <span class="badge text-bg-light" data-garantia-detail-tags-count="1" aria-live="polite">{{ etiquetas_count }}</span>
  </div>
  <div class="visually-hidden" role="status">{{ etiquetas_count }} etiquetas asignadas.</div>

  <div class="garantia-tags-section__list" data-garantia-tags-list="1">
    {% for etiqueta in etiquetas %}
    <div class="garantia-tags-section__chip" style="--garantia-tag-bg: {{ etiqueta.color }}; --garantia-tag-color: {{ etiqueta.color|contrast_color }};">
      <span>{{ etiqueta.nombre }}</span>
    </div>
    {% empty %}
    <div class="text-muted small">Sin etiquetas.</div>
    {% endfor %}
  </div>
</section>
