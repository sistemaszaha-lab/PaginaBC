<div
  class="garantia-inline-value"
  data-garantia-inline-field="cliente"
  data-update-url="{% url 'garantias:actualizar_garantia_inline' g.id %}">
  <div class="garantia-card__client">
    {% if g.cliente %}
      {{ g.cliente }}
    {% else %}
      <span class="garantia-card__placeholder">Sin cliente</span>
    {% endif %}
  </div>
</div>
