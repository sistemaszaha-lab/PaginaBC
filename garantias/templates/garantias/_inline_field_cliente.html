<div
  class="garantia-inline-value"
  data-garantia-quick-edit-open="1"
  data-current-value="{{ g.cliente_id|default:'' }}"
  data-garantia-quick-edit-url="{% url 'garantias:actualizar_garantia_inline' g.id %}">
  <div class="garantia-card__client">
    {% if g.cliente %}
      {{ g.cliente }}
    {% else %}
      <span class="garantia-card__placeholder">Sin cliente</span>
    {% endif %}
  </div>
</div>
