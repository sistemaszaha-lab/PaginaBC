<div class="garantias-column-item" data-garantia-column-item="1">
  <section
    class="garantias-column card h-100 border-0 shadow-sm"
    data-garantia-column="1"
    data-columna-id="{{ columna.id }}"
    data-columna-codigo="{{ columna.codigo }}"
    data-columna-nombre="{{ columna.nombre }}"
    data-edit-url="{% url 'garantias:columna_editar' columna.id %}"
    data-delete-url="{% url 'garantias:columna_eliminar' columna.id %}"
    data-paste-url="{{ columna.paste_url }}"
    data-estado="{{ columna.estado }}"
    data-total="{{ columna.count }}"
    data-loaded="{{ columna.loaded }}">
    <div class="card-header garantias-column__header">
      <div class="min-w-0 flex-grow-1">
        <h2 class="garantias-column__title mb-0" data-garantia-column-title="1">{{ columna.estado_texto }}</h2>
      </div>
      <div class="d-flex align-items-start gap-2">
        <span class="badge garantias-column__count" data-garantias-column-count="1">{{ columna.count }}</span>
        <div class="dropdown">
          <button
            class="btn btn-sm btn-light garantias-column__menu-btn"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false">
            Opciones
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <button
                type="button"
                class="dropdown-item"
                data-garantia-column-paste="1"
                disabled>
                Pegar tarjeta
              </button>
            </li>
            <li>
              <button
                type="button"
                class="dropdown-item"
                data-garantia-copy-clear="1"
                disabled>
                Cancelar copia
              </button>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <button
                type="button"
                class="dropdown-item"
                data-garantia-column-edit-open="1">
                Editar columna
              </button>
            </li>
            <li>
              <button
                type="button"
                class="dropdown-item text-danger"
                data-garantia-column-delete-open="1">
                Eliminar columna
              </button>
            </li>
          </ul>
        </div>
      </div>
    </div>

    {% if es_primera_columna %}
      <div class="garantias-column__actions px-3 pt-3">
        <button
          type="button"
          class="btn btn-sm garantias-column__add-btn"
          data-garantia-inline-open="1"
          data-columna-id="{{ columna.id }}"
          data-estado="{{ columna.estado }}"
          data-estado-label="{{ columna.estado_texto }}">
          + Nueva garantia
        </button>
      </div>
    {% endif %}

    <div
      class="card-body kanban-col garantias-column__body"
      data-columna-id="{{ columna.id }}"
      data-columna-codigo="{{ columna.codigo }}"
      data-columna-nombre="{{ columna.nombre }}"
      data-estado="{{ columna.estado }}">
      {% for g in columna.items %}
        {% include "garantias/_garantia_card.html" with g=g today=today columnas_estado=columnas_estado only %}
      {% empty %}
        <div class="garantia-empty">Sin garantias.</div>
      {% endfor %}
    </div>

    <div class="px-3 pb-3 text-center">
      <button
        type="button"
        class="btn btn-sm btn-outline-secondary"
        data-garantia-load-more="1"
        data-load-url="{{ columna.load_url }}"
        {% if not columna.has_more %}hidden{% endif %}>
        Cargar más{% if columna.remaining %} ({{ columna.remaining }}){% endif %}
      </button>
      <div
        class="small text-muted mt-2 d-none"
        data-garantia-load-indicator="1"
        role="status">
        Cargando...
      </div>
      <div
        class="small text-danger mt-2 d-none"
        data-garantia-load-error="1"
        role="alert"></div>
    </div>
  </section>
</div>
