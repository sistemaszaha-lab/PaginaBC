<div class="col-12 col-xl-3 col-md-6">
  <section
    class="garantias-column card h-100 border-0 shadow-sm"
    data-garantia-column="1"
    data-estado="{{ estado }}"
    data-total="{{ count }}"
    data-loaded="{{ loaded }}">
    <div class="card-header garantias-column__header">
      <div>
        <h2 class="garantias-column__title mb-0">{{ estado_texto }}</h2>
      </div>
      <span class="badge garantias-column__count" data-garantias-column-count="1">{{ count }}</span>
    </div>

    {% if es_primera_columna %}
    <div class="garantias-column__actions px-3 pt-3">
      <button
        type="button"
        class="btn btn-sm garantias-column__add-btn"
        data-garantia-inline-open="1"
        data-estado="{{ estado }}"
        data-estado-label="{{ estado_texto }}">
        + Nueva garantia
      </button>
    </div>
    {% endif %}

    <div class="card-body kanban-col garantias-column__body" data-estado="{{ estado }}">
      {% for g in items %}
        {% include "garantias/_garantia_card.html" with g=g today=today only %}
      {% empty %}
        <div class="garantia-empty">Sin garantias.</div>
      {% endfor %}
    </div>

    <div class="px-3 pb-3 text-center">
      <button
        type="button"
        class="btn btn-sm btn-outline-secondary"
        data-garantia-load-more="1"
        data-load-url="{{ load_url }}"
        {% if not has_more %}hidden{% endif %}>
        Cargar más{% if remaining %} ({{ remaining }}){% endif %}
      </button>
      <div
        class="small text-muted mt-2 d-none"
        data-garantia-load-indicator="1"
        role="status">
        Cargando...
      </div>
      <div
        class="small text-danger mt-2 d-none"
        data-garantia-load-error="1"
        role="alert"></div>
    </div>
  </section>
</div>
