<div class="col-12 col-xl-3 col-md-6">
  <section class="garantias-column card h-100 border-0 shadow-sm">
    <div class="card-header garantias-column__header">
      <div>
        <p class="garantias-column__eyebrow mb-1">Etapa</p>
        <h2 class="garantias-column__title mb-0">{{ estado_texto }}</h2>
      </div>
      <span class="badge garantias-column__count" data-garantias-column-count="1">{{ items|length }}</span>
    </div>

    <div class="garantias-column__actions px-3 pt-3">
      <button
        type="button"
        class="btn btn-sm garantias-column__add-btn"
        data-garantia-inline-open="1"
        data-estado="{{ estado }}">
        + Nueva garantia
      </button>
    </div>

    <div class="px-3 pt-3 d-none" data-garantia-inline-container="1" data-estado="{{ estado }}">
      {% include "garantias/_inline_create_form.html" with form=inline_form estado=estado only %}
    </div>

    <div class="card-body kanban-col garantias-column__body" data-estado="{{ estado }}">
      {% for g in items %}
        {% include "garantias/_garantia_card.html" with g=g today=today only %}
      {% empty %}
        <div class="garantia-empty">Sin garantias.</div>
      {% endfor %}
    </div>
  </section>
</div>
