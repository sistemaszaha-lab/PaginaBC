<div
 id="panel-operacion-{{ operacion.id }}"
 data-panel-operacion-card="1"
 data-panel-operacion-id="{{ operacion.id }}"
 class="card shadow-sm mb-3"
>

    <div class="card-body">

        <div class="d-flex justify-content-between">

            <div>

                <h6 class="fw-bold mb-1">
                    {{ operacion.titulo }}
                </h6>

                <div class="text-muted small">
                    {{ operacion.cliente }}
                </div>

            </div>

            <span class="
            badge
            {% if operacion.prioridad == 'ALTA' %}
            bg-danger
            {% elif operacion.prioridad == 'MEDIA' %}
            bg-warning text-dark
            {% else %}
            bg-secondary
            {% endif %}
            ">
                {{ operacion.prioridad }}
            </span>

        </div>

        <div class="mt-3">

            <strong>Asignados:</strong>

            {% for usuario in operacion.asignados.all %}

                <span class="badge bg-dark">

                    {{ usuario.first_name }}

                </span>

            {% empty %}

                —

            {% endfor %}

        </div>

        <div class="small text-muted mt-2">

            Vence:
            {{ operacion.fecha_vencimiento|date:"d M Y" }}

        </div>

        <div class="small text-muted">

            Comentarios:
            {{ operacion.comentarios_count|default:0 }}

        </div>
        <div class="mt-3 d-flex justify-content-end">

            <a
            href="{% url 'operaciones:detalle_operacion_modal' operacion.id %}"
            class="btn btn-sm btn-outline-primary"
            data-panel-operacion-modal-open="1"
            data-modal-url="{% url 'operaciones:detalle_operacion_modal' operacion.id %}">
            Ver
            </a>

        </div>

    </div>

</div>
