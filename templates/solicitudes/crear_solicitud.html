{% extends "base.html" %}

{% block title %}Nueva Solicitud{% endblock %}

{% block content %}

<h2 class="mb-4">Nueva Solicitud</h2>

<div class="card shadow-sm">
    <div class="card-body">

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next_url }}">

            {{ form.as_p }}

            <div class="mt-3">
                <button type="submit" class="btn btn-success">
                    Guardar
                </button>

                <a href="{% if next_url %}{{ next_url }}{% else %}{% url 'lista_solicitudes' %}{% endif %}"
                   class="btn btn-secondary">
                    Cancelar
                </a>
            </div>
        </form>

    </div>
</div>

{% include "clientes/_cliente_autocomplete.html" %}

{% endblock %}
